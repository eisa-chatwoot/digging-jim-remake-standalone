name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "standalone-v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS standalone apps
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wxWidgets
        run: brew install wxwidgets

      - name: Configure
        run: |
          wxwidgets_prefix="$(brew --prefix wxwidgets)"
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_PREFIX_PATH="${wxwidgets_prefix}"

      - name: Build and package standalone apps
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build-macos --target macos_bundle --config Release --parallel

          codesign --verify --deep --strict build-macos/bin/DiggingJim.app
          codesign --verify --deep --strict build-macos/bin/DiggingJimBuilder.app

          version="$(sed -nE 's/^project\(DiggingJim VERSION ([^ )]+).*/\1/p' CMakeLists.txt)"
          if [[ -z "${version}" ]]; then
            echo "Could not determine the project version from CMakeLists.txt" >&2
            exit 1
          fi

          arch="$(uname -m)"
          mkdir -p build-macos/dist
          ditto -c -k --sequesterRsrc --keepParent \
            build-macos/bin/DiggingJim.app \
            "build-macos/dist/DiggingJim-${version}-macos-${arch}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            build-macos/bin/DiggingJimBuilder.app \
            "build-macos/dist/DiggingJimBuilder-${version}-macos-${arch}.zip"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: standalone-macos
          path: build-macos/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows x64 standalone EXEs
    runs-on: windows-2022
    env:
      VCPKG_BASELINE: eaca4a577b6b678c6e10252754b6988a61746c19

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare pinned vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          if (Test-Path $vcpkgRoot) {
            Remove-Item -Recurse -Force $vcpkgRoot
          }

          New-Item -ItemType Directory -Force -Path $vcpkgRoot | Out-Null
          git -C $vcpkgRoot init
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgRoot fetch --depth=1 origin $env:VCPKG_BASELINE
          git -C $vcpkgRoot checkout --detach FETCH_HEAD

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build standalone EXEs
        shell: cmd
        run: scripts\windows\build-x64.cmd

      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -Path "build-windows/dist" -Filter "*-windows-x64.exe")
          if ($assets.Count -ne 2) {
            throw "Expected two Windows x64 EXEs, found $($assets.Count)"
          }

          $expectedNames = @("DiggingJim-", "DiggingJimBuilder-")
          foreach ($prefix in $expectedNames) {
            if (-not ($assets.Name -like "$prefix*")) {
              throw "Missing Windows release asset with prefix: $prefix"
            }
          }

          foreach ($asset in $assets) {
            $path = $asset.FullName
            $size = (Get-Item $path).Length
            if ($size -lt 10MB) {
              throw "Windows release asset is unexpectedly small: $path ($size bytes)"
            }
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: standalone-windows
          path: build-windows/dist/*-windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish standalone release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download built release assets
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
